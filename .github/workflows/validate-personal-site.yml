name: Validate personal site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, rebuild-v5-academicpages]

permissions:
  contents: read

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter
