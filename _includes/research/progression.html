{% assign rp = site.data.research_portfolio %}
<div class="research-progression" aria-label="Research programme progression">
  {% for project in rp.projects %}
    <div class="research-progression__item {% if project.code == 'P4' %}research-progression__item--flagship{% endif %}">
      <div class="research-progression__code">{{ project.code }}</div>
      <div class="research-progression__capability">{{ project.capability }}</div>
      <div class="research-progression__short">{{ project.short }}</div>
      {% if project.url %}<a class="research-progression__link" href="{{ project.url | relative_url }}">Open project</a>{% endif %}
    </div>
    {% unless forloop.last %}<div class="research-progression__arrow" aria-hidden="true">→</div>{% endunless %}
  {% endfor %}
</div>
